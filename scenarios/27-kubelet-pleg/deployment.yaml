apiVersion: v1
kind: Namespace
metadata:
  name: ktslab
  labels:
    app.kubernetes.io/part-of: ktslab
---
# A small workload used to observe node/kubelet health. When the kubelet's PLEG
# (Pod Lifecycle Event Generator) is unhealthy, the kubelet stops reporting
# accurate Pod status and the node can flap to NotReady — while these Pods may
# keep running on cached state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: ktslab
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      restartPolicy: Always
      containers:
        - name: webapp
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["echo 'webapp ready'; sleep 3600"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
