apiVersion: v1
kind: Namespace
metadata:
  name: ktslab
  labels:
    app.kubernetes.io/part-of: ktslab
---
# BUG: this CronJob runs every minute, but each Job runs for ~90s.
# With the default concurrencyPolicy (Allow), a new Job starts every minute
# even though the previous one is still running — Jobs pile up and run
# concurrently. There is also no startingDeadlineSeconds, so after a control
# plane pause the controller can start many "missed" schedules at once.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: ktslab
  labels:
    app: report
spec:
  schedule: "* * * * *"
  # concurrencyPolicy: Allow        # default: overlap allowed
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "report job started at $(date)"
                  sleep 90
                  echo "report job finished at $(date)"
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
