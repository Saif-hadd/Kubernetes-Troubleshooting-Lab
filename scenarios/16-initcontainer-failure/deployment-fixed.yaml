apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: ktslab
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      restartPolicy: Always
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          # FIX: retry inside the init container instead of exiting on the
          # first failure. An init container is the right place to wait for a
          # dependency; it just has to keep waiting.
          args:
            - |
              echo "waiting for migrate-db.ktslab.svc.cluster.local"
              until nslookup migrate-db.ktslab.svc.cluster.local; do
                echo "dependency not ready, retrying in 2s"
                sleep 2
              done
              echo "dependency is up"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: webapp
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["echo 'webapp ready'; sleep 3600"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
