apiVersion: v1
kind: Namespace
metadata:
  name: ktslab-restricted
  labels:
    app.kubernetes.io/part-of: ktslab
    # Enforce the Restricted Pod Security Standard. Any Pod that violates it is
    # REJECTED at creation (with `enforce`), and warned about/audited too.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
